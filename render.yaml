databases:
  - name: barrana-crm-db
    plan: free
    databaseName: barrana_crm
    user: barrana

services:
  - type: web
    plan: free
    name: barrana-crm-app
    runtime: node
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: barrana-crm-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://barrana-crm-app.onrender.com
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /opt/render/project/src/uploads
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_FROM
        value: noreply@barranaaccounting.ai
      - key: SIGNATURE_PROVIDER
        value: mock
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: ALLOWED_MIME_TYPES
        value: application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,application/vnd.ms-excel
      - key: EXTRACTION_PROVIDER
        value: claude
      - key: EXTRACTION_MODEL
        value: claude-opus-4-8
      # Secret — set the value in the Render dashboard (Environment tab), never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
